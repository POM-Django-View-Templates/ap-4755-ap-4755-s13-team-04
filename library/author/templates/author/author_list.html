<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Список авторів</title>
</head>
<body>
    <h2>Список авторів</h2>

    <a href="{% url 'create_author' %}"><button>+ Додати автора</button></a><br><br>

    <ul>
        {% for author in authors %}
            <li>
                ID: {{ author.id }} | {{ author.name }} {{ author.surname }} {{ author.patronymic }}
                
                <form method="POST" action="{% url 'delete_author' author.id %}" style="display:inline; margin-left: 10px;">
                    {% csrf_token %}
                    <button type="submit" style="color: red;">Видалити</button>
                </form>
            </li>
        {% empty %}
            <li>Авторів поки немає в базі.</li>
        {% endfor %}
    </ul>
    
</body>
</html>
